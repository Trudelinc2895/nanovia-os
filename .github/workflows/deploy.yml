name: Deploy Nanovia production

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nanovia-production-${{ vars.COMPOSE_PROJECT_NAME }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Canonical production deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      TARGET_BRANCH: ${{ github.ref_name }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      COMPOSE_WORKING_DIR: ${{ vars.COMPOSE_WORKING_DIR }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      POSTGRES_VOLUME_NAME: ${{ vars.POSTGRES_VOLUME_NAME }}
      REDIS_VOLUME_NAME: ${{ vars.REDIS_VOLUME_NAME }}
      RUNTIME_ENV_FILE: ${{ vars.RUNTIME_ENV_FILE }}
      BACKUP_ROOT: ${{ vars.BACKUP_ROOT }}
      EXPECTED_ALEMBIC_HEAD: c7e4a91f2b60
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          require_value() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production configuration: ${name}"
              exit 1
            fi
          }

          require_safe_path() {
            local name="$1"
            local value="${!name}"
            if ! [[ "${value}" =~ ^/?[A-Za-z0-9._/-]+$ ]] || [[ "${value}" == *..* ]]; then
              echo "::error::${name} contains unsafe path characters"
              exit 1
            fi
          }

          require_safe_name() {
            local name="$1"
            local value="${!name}"
            if ! [[ "${value}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || [[ "${value}" == *..* ]]; then
              echo "::error::${name} contains unsafe characters"
              exit 1
            fi
          }

          require_safe_ref() {
            local name="$1"
            local value="${!name}"
            if ! [[ "${value}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "${value}" == *..* ]]; then
              echo "::error::${name} contains unsafe ref characters"
              exit 1
            fi
          }

          for name in \
            DEPLOY_SHA \
            TARGET_BRANCH \
            DEPLOY_PATH \
            COMPOSE_WORKING_DIR \
            COMPOSE_PROJECT_NAME \
            POSTGRES_VOLUME_NAME \
            REDIS_VOLUME_NAME \
            RUNTIME_ENV_FILE \
            BACKUP_ROOT \
            VPS_HOST; do
            require_value "${name}"
          done

          if ! [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi

          case "${COMPOSE_PROJECT_NAME}" in
            nanovia-prod|nanovia-prod-*)
              echo "::error::The non-canonical nanovia-prod project is forbidden"
              exit 1
              ;;
          esac

          for volume_name in "${POSTGRES_VOLUME_NAME}" "${REDIS_VOLUME_NAME}"; do
            case "${volume_name}" in
              nanovia-prod_*)
                echo "::error::A non-canonical nanovia-prod volume is forbidden"
                exit 1
                ;;
            esac
          done

          case "${DEPLOY_PATH}" in
            /*) ;;
            *)
              echo "::error::DEPLOY_PATH must be an absolute path"
              exit 1
              ;;
          esac

          case "${COMPOSE_WORKING_DIR}" in
            /*) ;;
            *)
              echo "::error::COMPOSE_WORKING_DIR must be an absolute path"
              exit 1
              ;;
          esac

          require_safe_ref TARGET_BRANCH
          require_safe_path DEPLOY_PATH
          require_safe_path COMPOSE_WORKING_DIR
          require_safe_name COMPOSE_PROJECT_NAME
          require_safe_name POSTGRES_VOLUME_NAME
          require_safe_name REDIS_VOLUME_NAME
          require_safe_path RUNTIME_ENV_FILE
          require_safe_path BACKUP_ROOT
          if ! [[ "${VPS_HOST}" =~ ^[A-Za-z0-9.:-]+$ ]]; then
            echo "::error::VPS_HOST contains unsafe characters"
            exit 1
          fi

      - name: Check out the exact requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.deploy_sha }}

      - name: Verify GitHub authentication and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh auth status --hostname github.com >/dev/null
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
          git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"
          git merge-base --is-ancestor \
            "${DEPLOY_SHA}" \
            "refs/remotes/origin/${TARGET_BRANCH}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Register the VPS host key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "${HOME}/.ssh"
          ssh-keyscan -T 30 -H "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy exact commit to the canonical stack
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "deploy@${VPS_HOST}" \
            "DEPLOY_SHA='${DEPLOY_SHA}' TARGET_BRANCH='${TARGET_BRANCH}' DEPLOY_PATH='${DEPLOY_PATH}' COMPOSE_WORKING_DIR='${COMPOSE_WORKING_DIR}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' POSTGRES_VOLUME_NAME='${POSTGRES_VOLUME_NAME}' REDIS_VOLUME_NAME='${REDIS_VOLUME_NAME}' RUNTIME_ENV_FILE='${RUNTIME_ENV_FILE}' BACKUP_ROOT='${BACKUP_ROOT}' EXPECTED_ALEMBIC_HEAD='${EXPECTED_ALEMBIC_HEAD}' timeout 2400 bash -seuo pipefail" <<'ENDSSH'
          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          require_value() {
            local name="$1"
            [ -n "${!name:-}" ] || fail "Missing required value: ${name}"
          }

          require_safe_path() {
            local name="$1"
            local value="${!name}"
            [[ "${value}" =~ ^/?[A-Za-z0-9._/-]+$ ]] \
              && [[ "${value}" != *..* ]] \
              || fail "${name} contains unsafe path characters"
          }

          require_safe_name() {
            local name="$1"
            local value="${!name}"
            [[ "${value}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] \
              && [[ "${value}" != *..* ]] \
              || fail "${name} contains unsafe characters"
          }

          require_safe_ref() {
            local name="$1"
            local value="${!name}"
            [[ "${value}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
              && [[ "${value}" != *..* ]] \
              || fail "${name} contains unsafe ref characters"
          }

          single_container_for_service() {
            local service="$1"
            local ids=()
            mapfile -t ids < <(
              docker ps -q \
                --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            [ "${#ids[@]}" -eq 1 ] || fail "Expected one active ${service} container; found ${#ids[@]}"
            printf '%s' "${ids[0]}"
          }

          mounted_volume_name() {
            local container_id="$1"
            local destination="$2"
            docker inspect \
              --format '{{range .Mounts}}{{if eq .Destination "'"${destination}"'"}}{{.Name}}{{end}}{{end}}' \
              "${container_id}"
          }

          wait_for_healthy() {
            local service="$1"
            local container_id
            local health
            container_id="$(single_container_for_service "${service}")"
            for _ in $(seq 1 30); do
              health="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "${container_id}"
              )"
              [ "${health}" = "healthy" ] && return 0
              [ "${health}" = "running" ] && return 0
              sleep 5
            done
            fail "${service} did not become healthy"
          }

          wait_for_stable_running() {
            local service="$1"
            local container_id
            local initial_restart_count
            local restart_count
            local state
            local attempt
            container_id="$(single_container_for_service "${service}")"
            initial_restart_count="$(
              docker inspect --format '{{.RestartCount}}' "${container_id}"
            )"
            for attempt in $(seq 1 6); do
              state="$(docker inspect --format '{{.State.Status}}' "${container_id}")"
              restart_count="$(
                docker inspect --format '{{.RestartCount}}' "${container_id}"
              )"
              [ "${state}" = "running" ] \
                || fail "${service} is not running"
              [ "${restart_count}" = "${initial_restart_count}" ] \
                || fail "${service} restarted during postflight"
              [ "${attempt}" -eq 6 ] && return 0
              sleep 5
            done
            fail "${service} did not remain stable"
          }

          for name in \
            DEPLOY_SHA \
            TARGET_BRANCH \
            DEPLOY_PATH \
            COMPOSE_WORKING_DIR \
            COMPOSE_PROJECT_NAME \
            POSTGRES_VOLUME_NAME \
            REDIS_VOLUME_NAME \
            RUNTIME_ENV_FILE \
            BACKUP_ROOT \
            EXPECTED_ALEMBIC_HEAD; do
            require_value "${name}"
          done

          case "${COMPOSE_PROJECT_NAME}" in
            nanovia-prod|nanovia-prod-*) fail "The nanovia-prod project is forbidden" ;;
          esac
          case "${POSTGRES_VOLUME_NAME}:${REDIS_VOLUME_NAME}" in
            *nanovia-prod_*) fail "A nanovia-prod volume is forbidden" ;;
          esac
          case "${DEPLOY_PATH}" in
            /*) ;;
            *) fail "DEPLOY_PATH must be an absolute path" ;;
          esac
          case "${COMPOSE_WORKING_DIR}" in
            /*) ;;
            *) fail "COMPOSE_WORKING_DIR must be an absolute path" ;;
          esac
          require_safe_ref TARGET_BRANCH
          require_safe_path DEPLOY_PATH
          require_safe_path COMPOSE_WORKING_DIR
          require_safe_name COMPOSE_PROJECT_NAME
          require_safe_name POSTGRES_VOLUME_NAME
          require_safe_name REDIS_VOLUME_NAME
          require_safe_path RUNTIME_ENV_FILE
          require_safe_path BACKUP_ROOT

          command -v flock >/dev/null || fail "flock is required"
          exec 9>"/tmp/nanovia-${COMPOSE_PROJECT_NAME}.deploy.lock"
          flock -n 9 || fail "Another canonical deployment is already running"

          [ -d "${DEPLOY_PATH}/.git" ] || fail "Canonical deploy checkout is missing"
          REAL_DEPLOY_PATH="$(realpath "${DEPLOY_PATH}")"
          [ "${REAL_DEPLOY_PATH}" = "${DEPLOY_PATH}" ] || fail "DEPLOY_PATH is not its canonical real path"
          [ -d "${COMPOSE_WORKING_DIR}" ] || fail "Canonical Compose working directory is missing"
          REAL_COMPOSE_WORKING_DIR="$(realpath "${COMPOSE_WORKING_DIR}")"
          [ "${REAL_COMPOSE_WORKING_DIR}" = "${COMPOSE_WORKING_DIR}" ] \
            || fail "COMPOSE_WORKING_DIR is not its canonical real path"

          cd "${DEPLOY_PATH}"
          [ -z "$(git status --porcelain --untracked-files=all)" ] || {
            git status --short >&2
            fail "Checkout is dirty or contains unreconciled files"
          }

          PUBLIC_CADDY_IDS=()
          mapfile -t PUBLIC_CADDY_IDS < <(
            docker ps -q \
              --filter "label=com.docker.compose.service=caddy" \
              --filter "publish=80"
          )
          [ "${#PUBLIC_CADDY_IDS[@]}" -eq 1 ] || fail "Unable to identify one public Caddy container"

          ACTIVE_PROJECT="$(
            docker inspect \
              --format '{{index .Config.Labels "com.docker.compose.project"}}' \
              "${PUBLIC_CADDY_IDS[0]}"
          )"
          ACTIVE_WORKING_DIR="$(
            docker inspect \
              --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' \
              "${PUBLIC_CADDY_IDS[0]}"
          )"
          [ "${ACTIVE_PROJECT}" = "${COMPOSE_PROJECT_NAME}" ] || fail "Configured Compose project is not the public project"
          [ -n "${ACTIVE_WORKING_DIR}" ] || fail "Public Compose working directory label is absent"
          [ "${ACTIVE_WORKING_DIR}" = "${COMPOSE_WORKING_DIR}" ] \
            || fail "Configured COMPOSE_WORKING_DIR does not match the public Compose working directory label"

          docker volume inspect "${POSTGRES_VOLUME_NAME}" >/dev/null \
            || fail "Expected PostgreSQL volume is absent"
          docker volume inspect "${REDIS_VOLUME_NAME}" >/dev/null \
            || fail "Expected Redis volume is absent"

          POSTGRES_CONTAINER="$(single_container_for_service postgres)"
          REDIS_CONTAINER="$(single_container_for_service redis)"
          API_CONTAINER="$(single_container_for_service api)"

          [ "$(mounted_volume_name "${POSTGRES_CONTAINER}" /var/lib/postgresql/data)" = "${POSTGRES_VOLUME_NAME}" ] \
            || fail "PostgreSQL is mounted on a different volume"
          [ "$(mounted_volume_name "${REDIS_CONTAINER}" /data)" = "${REDIS_VOLUME_NAME}" ] \
            || fail "Redis is mounted on a different volume"

          AVAILABLE_BYTES="$(df -Pk "${BACKUP_ROOT%/*}" | awk 'NR == 2 {print $4 * 1024}')"
          DATABASE_BYTES="$(
            docker exec "${POSTGRES_CONTAINER}" sh -ceu \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT pg_database_size(current_database())"'
          )"
          REQUIRED_BYTES=$((2147483648 + (DATABASE_BYTES * 2)))
          [ "${AVAILABLE_BYTES}" -ge "${REQUIRED_BYTES}" ] \
            || fail "Insufficient free space for build and verified database backup"

          PREVIOUS_COMMIT="$(git rev-parse HEAD)"
          CURRENT_ALEMBIC="$(
            docker exec "${API_CONTAINER}" alembic current 2>/dev/null \
              | awk 'NF {print $1; exit}'
          )"
          [ -n "${CURRENT_ALEMBIC}" ] || fail "Unable to read the current Alembic revision"

          git fetch --prune origin
          git cat-file -e "${DEPLOY_SHA}^{commit}" || fail "Requested commit does not exist after fetch"
          git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}" \
            || fail "Selected workflow branch does not exist on origin"
          git merge-base --is-ancestor \
            "${DEPLOY_SHA}" \
            "refs/remotes/origin/${TARGET_BRANCH}" \
            || fail "Requested commit does not belong to the selected workflow branch"
          git switch --detach "${DEPLOY_SHA}"
          [ "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" ] || fail "Requested commit was not selected"
          [ -z "$(git status --porcelain --untracked-files=all)" ] || fail "Checkout became dirty after selecting the requested commit"

          if [[ "${RUNTIME_ENV_FILE}" = /* ]]; then
            ENV_FILE="${RUNTIME_ENV_FILE}"
          else
            case "${RUNTIME_ENV_FILE}" in
              *..*) fail "RUNTIME_ENV_FILE must not traverse parent directories" ;;
            esac
            ENV_FILE="${DEPLOY_PATH}/${RUNTIME_ENV_FILE}"
          fi
          [ -f "${ENV_FILE}" ] || fail "Configured runtime environment file is absent"

          COMPOSE_FILES=(
            -f docker-compose.prod.yml
            -f docker-compose.canonical-prod.yml
          )
          compose() {
            (
              cd "${REAL_COMPOSE_WORKING_DIR}"
              docker compose \
                -p "${COMPOSE_PROJECT_NAME}" \
                "${COMPOSE_FILES[@]}" \
                --env-file "${ENV_FILE}" \
                "$@"
            )
          }

          compose config --quiet

          CANONICAL_VOLUMES=(
            "${POSTGRES_VOLUME_NAME}"
            "${REDIS_VOLUME_NAME}"
            "${COMPOSE_PROJECT_NAME}_caddy_data"
            "${COMPOSE_PROJECT_NAME}_caddy_config"
            "${COMPOSE_PROJECT_NAME}_grafana_data"
            "${COMPOSE_PROJECT_NAME}_prometheus_data"
            "${COMPOSE_PROJECT_NAME}_alertmanager_data"
          )
          for volume_name in "${CANONICAL_VOLUMES[@]}"; do
            docker volume inspect "${volume_name}" >/dev/null \
              || fail "A canonical external volume is absent"
          done

          compose build api ai-orchestrator web admin

          TARGET_ALEMBIC="$(
            compose run --rm --no-deps -T api alembic heads 2>/dev/null \
              | awk 'NF {print $1; exit}'
          )"
          [ "${TARGET_ALEMBIC}" = "${EXPECTED_ALEMBIC_HEAD}" ] \
            || fail "Target Alembic head differs from the approved head"
          compose run --rm --no-deps -T api alembic history 2>/dev/null \
            | grep -Fq "${CURRENT_ALEMBIC}" \
            || fail "Current Alembic revision is absent from the target migration history"

          WRITERS_STOPPED=0
          resume_previous_writers() {
            if [ "${WRITERS_STOPPED}" -eq 1 ]; then
              compose start api ai-orchestrator >/dev/null 2>&1 || true
            fi
          }
          trap resume_previous_writers EXIT

          compose stop api ai-orchestrator
          WRITERS_STOPPED=1

          BACKUP_RESULT="$(
            DEPLOY_PATH="${DEPLOY_PATH}" \
            COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}" \
            POSTGRES_VOLUME_NAME="${POSTGRES_VOLUME_NAME}" \
            REDIS_VOLUME_NAME="${REDIS_VOLUME_NAME}" \
            RUNTIME_ENV_FILE="${ENV_FILE}" \
            BACKUP_ROOT="${BACKUP_ROOT}" \
            PREVIOUS_COMMIT="${PREVIOUS_COMMIT}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            CURRENT_ALEMBIC="${CURRENT_ALEMBIC}" \
            EXPECTED_ALEMBIC_HEAD="${EXPECTED_ALEMBIC_HEAD}" \
            bash infra/scripts/pre-migration-backup.sh
          )"
          printf '%s\n' "${BACKUP_RESULT}"
          BACKUP_GATE="$(
            printf '%s\n' "${BACKUP_RESULT}" \
              | sed -n 's/^VERIFIED_BACKUP_GATE=//p'
          )"
          [ -n "${BACKUP_GATE}" ] && [ -f "${BACKUP_GATE}" ] \
            || fail "Verified backup gate is absent"

          compose run --rm --no-deps -T api alembic upgrade "${EXPECTED_ALEMBIC_HEAD}"
          POST_MIGRATION_ALEMBIC="$(
            compose run --rm --no-deps -T api alembic current 2>/dev/null \
              | awk 'NF {print $1; exit}'
          )"
          [ "${POST_MIGRATION_ALEMBIC}" = "${EXPECTED_ALEMBIC_HEAD}" ] \
            || fail "Post-migration Alembic revision is incorrect"

          compose up -d --force-recreate --no-deps \
            api ai-orchestrator web admin caddy alertmanager
          WRITERS_STOPPED=0
          trap - EXIT

          wait_for_healthy postgres
          wait_for_healthy redis
          wait_for_healthy api
          wait_for_healthy web
          wait_for_stable_running alertmanager

          [ "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" ] \
            || fail "Deployed checkout no longer matches the requested commit"

          if docker ps \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
            --format '{{.Status}}' \
            | grep -qi 'restarting'; then
            fail "At least one canonical container is restarting"
          fi

          printf 'DEPLOYED_COMMIT=%s\n' "${DEPLOY_SHA}"
          printf 'ALEMBIC_REVISION=%s\n' "${POST_MIGRATION_ALEMBIC}"
          printf 'CANONICAL_DEPLOYMENT=verified\n'
          ENDSSH
