name: Frontend security lock refresh

on:
  push:
    branches:
      - security/nextjs-15-5-24-autofix
    paths:
      - frontend/client/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      - name: Refresh lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Report remaining dependency vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add package-lock.json
          git commit -m "chore(security): refresh frontend lockfile"
          git push origin "HEAD:$GITHUB_REF_NAME"
