name: CI — Backend & Frontend

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main, integrate/nanovia-j21-main]

# Required to publish Trivy SARIF results to GitHub Code Scanning.
# Keep every other workflow permission read-only by default.
permissions:
  contents: read
  security-events: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kttest
          POSTGRES_USER: ktuser
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]

      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: cd backend && pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://ktuser:testpass@localhost:5432/kttest
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: testsecretkeyminimum32characters
          SECRET_KEY: testsecretkey
          JWT_ALGORITHM: HS256
          STRIPE_SECRET_KEY: stripe_secret_fake
          STRIPE_WEBHOOK_SECRET: stripe_webhook_fake
          APP_ENV: test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/client/package-lock.json

      - name: Install frontend deps
        working-directory: frontend/client
        run: npm ci

      - name: Build frontend
        working-directory: frontend/client
        run: npm run build

  docker-build-scan:
    name: Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: nanovia-api:ci
          load: true

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nanovia-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    environment: staging
    concurrency:
      group: nanovia-staging-deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Check deploy secrets
        id: secrets-check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging deploy skipped — configure VPS_HOST, VPS_SSH_PRIVATE_KEY and DEPLOY_PATH"
          fi

      - name: Setup SSH agent
        if: steps.secrets-check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        if: steps.secrets-check.outputs.configured == 'true'
        run: ssh-keyscan -T 30 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy staging
        if: steps.secrets-check.outputs.configured == 'true'
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=60 \
              "deploy@${{ secrets.VPS_HOST }}" \
              "TARGET_ENV=staging TARGET_REF='${{ github.ref_name }}' TARGET_SHA='${{ github.sha }}' DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' \
               REPO_URL='https://github.com/${{ github.repository }}.git' \
               timeout 900 bash -seuo pipefail" <<'ENDSSH'
              ensure_clean_worktree() {
                if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                  echo "ERROR: staging checkout contains local modifications" >&2
                  exit 1
                fi
              }

              wait_for_healthy() {
                local service="$1"
                local attempts=60
                local container_id
                local health
                while [ "${attempts}" -gt 0 ]; do
                  container_id="$(docker compose "${COMPOSE_ARGS[@]}" ps -q "${service}")"
                  if [ -n "${container_id}" ]; then
                    health="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
                    if [ "${health}" = "healthy" ]; then
                      return 0
                    fi
                  fi
                  sleep 5
                  attempts=$((attempts - 1))
                done
                echo "ERROR: ${service} did not become healthy within 300 seconds" >&2
                docker compose "${COMPOSE_ARGS[@]}" ps "${service}" >&2 || true
                return 1
              }

              retry_curl() {
                local url="$1"
                local attempts=60
                while [ "${attempts}" -gt 0 ]; do
                  if curl --fail --silent --show-error --max-time 5 "${url}" >/dev/null; then
                    return 0
                  fi
                  sleep 5
                  attempts=$((attempts - 1))
                done
                echo "ERROR: health probe failed after 300 seconds: ${url}" >&2
                return 1
              }

              cd "${DEPLOY_PATH}"
              ensure_clean_worktree
              git fetch --prune origin
              git cat-file -e "${TARGET_SHA}^{commit}"
              git checkout --detach "${TARGET_SHA}"
              ensure_clean_worktree
              COMPOSE_ARGS=(
                -p nanovia-staging
                -f infra/docker-compose.prod.yml
                -f infra/docker-compose.staging.yml
                --env-file .env.staging
              )
              docker compose "${COMPOSE_ARGS[@]}" up -d postgres redis
              wait_for_healthy postgres
              wait_for_healthy redis
              bash infra/scripts/staging-migrate.sh
              docker compose "${COMPOSE_ARGS[@]}" build web admin ai-orchestrator
              docker compose "${COMPOSE_ARGS[@]}" up -d --no-build --force-recreate \
                web admin api ai-orchestrator
              WEB_ADDR="$(docker compose "${COMPOSE_ARGS[@]}" port web 3000 | tail -n 1)"
              ADMIN_ADDR="$(docker compose "${COMPOSE_ARGS[@]}" port admin 3020 | tail -n 1)"
              API_ADDR="$(docker compose "${COMPOSE_ARGS[@]}" port api 8010 | tail -n 1)"
              AI_ADDR="$(docker compose "${COMPOSE_ARGS[@]}" port ai-orchestrator 8020 | tail -n 1)"
              [ -n "${WEB_ADDR}" ] && [ -n "${ADMIN_ADDR}" ] \
                && [ -n "${API_ADDR}" ] && [ -n "${AI_ADDR}" ]
              test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
              ensure_clean_worktree
              retry_curl "http://${WEB_ADDR}/"
              retry_curl "http://${ADMIN_ADDR}/"
              retry_curl "http://${API_ADDR}/api/v1/health/ready"
              retry_curl "http://${AI_ADDR}/health"
              echo "staging deploy ${TARGET_SHA} successful"
          ENDSSH
