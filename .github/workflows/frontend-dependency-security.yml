name: Frontend dependency security gate

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/client/package.json
      - frontend/client/package-lock.json
      - .github/dependabot.yml
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Block high or critical npm vulnerabilities
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
