name: One-off credit currency rotation fix

on:
  push:
    branches:
      - integrate/nanovia-j21-main
    paths:
      - .github/workflows/_oneoff_credit_currency_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate/nanovia-j21-main
          fetch-depth: 0

      - name: Apply exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path("backend/api/services/billing_service.py")
          text = service.read_text(encoding="utf-8")

          obsolete_assignment = "    current_currency = current_contract.currency\n"
          obsolete_guard = "        or currency != current_currency\n"
          anchor = "    current_price_id = current_contract.price_id\n"

          if text.count(obsolete_assignment) != 1:
              raise SystemExit("Expected exactly one current_currency assignment")
          if text.count(obsolete_guard) != 1:
              raise SystemExit("Expected exactly one current-currency rejection guard")
          if text.count(anchor) != 1:
              raise SystemExit("Expected exactly one current_price_id anchor")

          text = text.replace(obsolete_assignment, "", 1)
          text = text.replace(obsolete_guard, "", 1)
          text = text.replace(
              anchor,
              anchor
              + "    # A delayed Checkout remains bound to its authenticated historical Price\n"
              + "    # currency even if the current credit catalog has rotated currencies.\n",
              1,
          )
          service.write_text(text, encoding="utf-8")

          regression = Path("backend/tests/test_credit_currency_rotation_contract.py")
          regression.write_text(
              '''from pathlib import Path\n\n\ndef test_historical_credit_currency_is_not_tied_to_current_catalog_currency():\n    source = (\n        Path(__file__).resolve().parents[1]\n        / "api"\n        / "services"\n        / "billing_service.py"\n    ).read_text(encoding="utf-8")\n    start = source.index("def validate_credit_checkout_contract(")\n    end = source.index("async def verify_credit_checkout_session(", start)\n    contract = source[start:end]\n\n    assert "current_currency = current_contract.currency" not in contract\n    assert "currency != current_currency" not in contract\n    assert 'stripe_field(provider_session, "currency") != currency' in contract\n    assert 'stripe_field(payment_intent, "currency") != currency' in contract\n''',
              encoding="utf-8",
          )
          PY

          python3 -m py_compile backend/api/services/billing_service.py backend/tests/test_credit_currency_rotation_contract.py
          git diff --check

      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/services/billing_service.py backend/tests/test_credit_currency_rotation_contract.py
          git commit -m "fix(billing): preserve delayed credits across currency rotation"
          git push origin HEAD:integrate/nanovia-j21-main
